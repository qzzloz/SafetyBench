name: "jailbound"

parameters:
    # --- white-box target (loaded from multimodalmodels/, like UMK) ---
    target_model: "qwen2_5_vl.qwen_whitebox.QwenVLWhiteBox"
    target_model_name: "Qwen2.5-VL-7B-Instruct"
    model_name: "/scratch/x3411a15/models/Qwen2.5-VL-7B-Instruct"   # or HF id
    load_model: true
    device: "cuda"
    dtype: "float16"                 # V100 -> fp16, NOT bfloat16
    max_pixels: 401408               # = 512*28*28 ; lower if you OOM
    gradient_checkpointing: true     # needed for backprop on a 32GB V100

    # --- Stage 1 boundary artifact (build with attacks.jailbound.probing) ---
    boundary_path: "attacks/jailbound/cache/boundary.pt"

    # --- Stage 2a: image crossing ---
    layer_min_cv: 0.80               # use fusion layers with Stage-1 CV acc >= this
    last_n: null                     # or set an int to use the last-N layers instead
    weight_by_cv: true
    eps: 0.03137254901               # 8/255 L_inf budget (raw [0,1] space)
    n_iters: 150
    eta: 0.00392156862               # 1/255 PGD step
    lambda_geo: 1.0
    eps_scale: 1.0
    pool: "last"

    # --- Stage 2b: text suffix (auto-disabled if embed-parity check fails) ---
    use_suffix: true
    suffix_len: 20
    suffix_iters: 100
    eta_t: 0.0005
    lambda_sem: 2.0
    init_token: " x"